services:
  db:
    image: postgres:15-alpine
    container_name: beleqet2-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beleqet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password}
      POSTGRES_DB: ${POSTGRES_DB:-beleqet_db}
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: beleqet2-redis
    restart: always
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beleqet2-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4000
      # Admin (:3000) + jobs app (:3001) — comma-separated for CORS
      - FRONTEND_URL=${FRONTEND_URL:-https://beleqetjobs.com,https://www.beleqetjobs.com,https://admin.beleqetjobs.com,https://beleqetpay.com,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      - DATABASE_URL=${DATABASE_URL:-postgresql://beleqet_staging:Beleqet@Staging2026!@db:5432/beleqet_staging}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_TLS=${REDIS_TLS:-false}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-docker_default_secret_please_change_in_production}
      - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES:-15m}
      - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES:-30d}
      - SESSION_SECRET=${SESSION_SECRET:-docker_session_secret_please_change_in_production_64chars_min}
      - OAUTH_TOKEN_ENCRYPTION_KEY=${OAUTH_TOKEN_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-docker-google-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-docker-google-client-secret}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/v1/auth/google/callback}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-docker-linkedin-client-id}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-docker-linkedin-client-secret}
      - LINKEDIN_CALLBACK_URL=${LINKEDIN_CALLBACK_URL:-http://localhost:4000/api/v1/auth/linkedin/callback}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3001}
      - BULL_BOARD_USERNAME=${BULL_BOARD_USERNAME:-admin}
      - BULL_BOARD_PASSWORD=${BULL_BOARD_PASSWORD:-admin}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy_key_for_testing}
      - GDPR_ENCRYPTION_KEY=${GDPR_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
      - E2EE_SERVER_KEY=${E2EE_SERVER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - E2EE_KEY_VERSION=${E2EE_KEY_VERSION:-v1}
      - BELEQET_PAY_API_URL=${BELEQET_PAY_API_URL:-http://beleqet-pay-api:4001}
      - BELEQET_PAY_SERVICE_KEY=${BELEQET_PAY_SERVICE_KEY:-synthetic_beleqet_pay_service_key_please_change_in_production}
      - TOTP_TEMP_SECRET=${TOTP_TEMP_SECRET:-docker_totp_temp_secret_please_change_in_production}
      - TOTP_ISSUER=${TOTP_ISSUER:-Beleqet}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-dummy}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-dummy}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-dummy}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-dummy}
      - BILLING_WEBHOOK_SECRET=${BILLING_WEBHOOK_SECRET:-dummy}
      - UNSUBSCRIBE_SECRET=${UNSUBSCRIBE_SECRET:-docker_default_unsubscribe_secret_please_change_in_production}
      - CHAPA_SECRET_KEY=${CHAPA_SECRET_KEY:-CHASECK_TEST-dummy}
      - CHAPA_PUBLIC_KEY=${CHAPA_PUBLIC_KEY:-CHAPUBK_TEST-dummy}
      - CHAPA_WEBHOOK_SECRET=${CHAPA_WEBHOOK_SECRET:-docker_chapa_webhook_secret}
      - CHAPA_CALLBACK_URL=${CHAPA_CALLBACK_URL:-http://localhost:4000/api/v1/escrow/callback}
      - CHAPA_RETURN_URL=${CHAPA_RETURN_URL:-http://localhost:3001/freelance/payment-success}
      - SMTP_HOST=${SMTP_HOST:-smtp.ethereal.email}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-docker-smtp-user}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-docker-smtp-password}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-Beleqet <noreply@beleqet.com>}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.beleqetjobs.com/api/v1
    container_name: beleqet2-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.beleqetjobs.com/api/v1}
    depends_on:
      - backend

  jobs-frontend:
    build:
      context: .
      dockerfile: beleqet-jobs-nextjs/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.beleqetjobs.com/api/v1
    container_name: beleqet2-jobs-frontend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.beleqetjobs.com/api/v1}
    depends_on:
      - backend

  # ── Homepage / landing page (frontend-main) → port 3002 ──────────────────
  homepage-frontend:
    build:
      context: ./frontend-main
      dockerfile: Dockerfile
    container_name: beleqet2-homepage
    restart: unless-stopped
    ports:
      - '3002:3002'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
