# Production: the API, website and admin with their database and cache, as they run on the
# server (/srv/beleqet). Every secret is a ${VAR} filled from that folder's .env, which
# is root-only and not in git. Deploys pull the images CI built (no builds on the server); see
# scripts/deploy/deploy-production.sh.
#
# Running it elsewhere: put the variables in a .env next to this file, and create Beleqet Pay's
# network once (docker network create beleqet-network), which the API joins.
#
# One name per app everywhere: the folder apps/<name>, the service <name>, the container
# beleqet-<name> and the image beleqet-<name>.
name: beleqet

services:
  db:
    image: postgres:15-alpine
    container_name: beleqet-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: beleqet_db
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: beleqet-redis
    restart: always
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: beleqet-api
    restart: unless-stopped
    networks:
      - default
      - beleqet-pay-net
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      # Admin (:3000) + jobs app (:3001) — comma-separated for CORS
      - API_BASE_URL=https://api.beleqetjobs.com/api/v1
      - FRONTEND_URL=https://beleqetjobs.com,https://www.beleqetjobs.com,https://admin.beleqetjobs.com,https://beleqetpay.com,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_TLS=false
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=30d
      - TELEGRAM_BOT_API_TOKEN=${TELEGRAM_BOT_API_TOKEN}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - PII_SALT=${PII_SALT}
      - TELEGRAM_MINI_APP_BOT_TOKENS=${TELEGRAM_MINI_APP_BOT_TOKENS}
      - SESSION_SECRET=${SESSION_SECRET}
      - OAUTH_TOKEN_ENCRYPTION_KEY=${OAUTH_TOKEN_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://api.beleqetjobs.com/api/v1/auth/google/callback
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_CALLBACK_URL=https://api.beleqetjobs.com/api/v1/auth/linkedin/callback
      - APP_BASE_URL=https://api.beleqetjobs.com/api/v1
      - BULL_BOARD_USERNAME=${BULL_BOARD_USERNAME}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - TELEGRAM_ENABLED=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBAPP_URL=https://beleqet.com
      - BULL_BOARD_PASSWORD=${BULL_BOARD_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - GDPR_ENCRYPTION_KEY=${GDPR_ENCRYPTION_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY}
      - E2EE_SERVER_KEY=${E2EE_SERVER_KEY}
      - E2EE_KEY_VERSION=v1
      - BELEQET_PAY_API_URL=http://beleqet-pay-api:4001
      - BELEQET_PAY_SERVICE_KEY=${BELEQET_PAY_SERVICE_KEY}
      - TOTP_TEMP_SECRET=${TOTP_TEMP_SECRET}
      - TOTP_ISSUER=Beleqet
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - PAYPAL_MODE=sandbox
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID}
      - PAYPAL_RETURN_URL=https://beleqetjobs.com/payment/success
      - PAYPAL_CANCEL_URL=https://beleqetjobs.com/payment/cancel
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - BILLING_WEBHOOK_SECRET=${BILLING_WEBHOOK_SECRET}
      - UNSUBSCRIBE_SECRET=${UNSUBSCRIBE_SECRET}
      - CHAPA_SECRET_KEY=${CHAPA_SECRET_KEY}
      - CHAPA_PUBLIC_KEY=${CHAPA_PUBLIC_KEY}
      - CHAPA_WEBHOOK_SECRET=${CHAPA_WEBHOOK_SECRET}
      - BELEQET_BOT_WEBHOOK_URL=https://webhook.beleqet.com/webhook
      - WEBHOOK_SECRET_TOKEN=${WEBHOOK_SECRET_TOKEN}
      - CHAPA_CALLBACK_URL=https://api.beleqetjobs.com/api/v1/escrow/callback
      - CHAPA_RETURN_URL=https://beleqetjobs.com/payment/success
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
    volumes:
      - ./uploads-local:/app/temp-storage
    depends_on:
      - db
      - redis

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.beleqetjobs.com/api/v1
    container_name: beleqet-admin
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=https://api.beleqetjobs.com/api/v1
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.beleqetjobs.com/api/v1
    container_name: beleqet-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      - NEXT_PUBLIC_API_URL=https://api.beleqetjobs.com/api/v1
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
    depends_on:
      - api

volumes:
  db_data:
  redis_data:

networks:
  beleqet-pay-net:
    external: true
    name: beleqet-network
