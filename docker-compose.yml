services:
  db:
    image: postgres:15-alpine
    container_name: beleqet2-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: beleqet_db
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: beleqet2-redis
    restart: always
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beleqet2-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      # Admin (:3000) + jobs app (:3001) — comma-separated for CORS
      - FRONTEND_URL=https://beleqetjobs.com,https://www.beleqetjobs.com,https://admin.beleqetjobs.com,https://beleqetpay.com,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_TLS=false
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=30d
      - SESSION_SECRET=${SESSION_SECRET}
      - OAUTH_TOKEN_ENCRYPTION_KEY=${OAUTH_TOKEN_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=docker-google-client-id
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=http://localhost:4000/api/v1/auth/google/callback
      - LINKEDIN_CLIENT_ID=docker-linkedin-client-id
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_CALLBACK_URL=http://localhost:4000/api/v1/auth/linkedin/callback
      - APP_BASE_URL=http://localhost:3001
      - BULL_BOARD_USERNAME=${BULL_BOARD_USERNAME}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - TELEGRAM_ENABLED=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBAPP_URL=https://beleqet.com
      - BULL_BOARD_PASSWORD=${BULL_BOARD_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GDPR_ENCRYPTION_KEY=${GDPR_ENCRYPTION_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY}
      - E2EE_SERVER_KEY=${E2EE_SERVER_KEY}
      - E2EE_KEY_VERSION=v1
      - BELEQET_PAY_API_URL=http://beleqet-pay-api:4001
      - BELEQET_PAY_SERVICE_KEY=${BELEQET_PAY_SERVICE_KEY}
      - TOTP_TEMP_SECRET=${TOTP_TEMP_SECRET}
      - TOTP_ISSUER=Beleqet
      - PAYPAL_CLIENT_ID=dummy
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - BILLING_WEBHOOK_SECRET=${BILLING_WEBHOOK_SECRET}
      - UNSUBSCRIBE_SECRET=${UNSUBSCRIBE_SECRET}
      - CHAPA_SECRET_KEY=${CHAPA_SECRET_KEY}
      - CHAPA_PUBLIC_KEY=${CHAPA_PUBLIC_KEY}
      - CHAPA_WEBHOOK_SECRET=${CHAPA_WEBHOOK_SECRET}
      - BELEQET_BOT_WEBHOOK_URL=https://webhook.beleqet.com/webhook
      - WEBHOOK_SECRET_TOKEN=${WEBHOOK_SECRET_TOKEN}
      - CHAPA_CALLBACK_URL=http://localhost:4000/api/v1/escrow/callback
      - CHAPA_RETURN_URL=http://localhost:3001/freelance/payment-success
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.beleqetjobs.com/api/v1
    container_name: beleqet2-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=https://api.beleqetjobs.com/api/v1
    depends_on:
      - backend

  jobs-frontend:
    build:
      context: .
      dockerfile: beleqet-jobs-nextjs/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.beleqetjobs.com/api/v1
    container_name: beleqet2-jobs-frontend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NEXT_PUBLIC_API_URL=https://api.beleqetjobs.com/api/v1
    depends_on:
      - backend

  # ── Homepage / landing page (frontend-main) → port 3002 ──────────────────
  homepage-frontend:
    build:
      context: ./frontend-main
      dockerfile: Dockerfile
    container_name: beleqet2-homepage
    restart: unless-stopped
    ports:
      - '3002:3002'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
