map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name beleqetjobs.com www.beleqetjobs.com api.beleqetjobs.com admin.beleqetjobs.com;
    return 301 https://$host$request_uri;
}

# www -> beleqetjobs.com: one address, so Telegram's login button (one domain per bot) works.
server {
    listen 443 ssl;
    server_name www.beleqetjobs.com;
    ssl_certificate     /etc/nginx/ssl/beleqet.crt;
    ssl_certificate_key /etc/nginx/ssl/beleqet.key;
    return 301 https://beleqetjobs.com$request_uri;
}

# ── Jobs & Freelance homepage ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name beleqetjobs.com;

    ssl_certificate     /etc/nginx/ssl/beleqet.crt;
    ssl_certificate_key /etc/nginx/ssl/beleqet.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }


    location /_next/image {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }


    # SGS Creative Challenge: Telegram Mini App served by the Jobs bot (port 8082)
    location = /challenge {
        return 301 /challenge/$is_args$args;
    }
    location ^~ /challenge/ {
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
    location ^~ /api/challenge/ {
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        client_max_body_size 6m;
    }

    location ~ ^/(jobs|freelance/[^$]|dashboard|login|register|forgot-password|profile|post-job|employer|cv-maker|applications|admin|messages|feed|forum|portfolio|checkout|payment|auth|chat|chat-to-text|post-project|resume-brain|storage|about|contact|pricing|tax-calculator|api) {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# ── Backend API ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.beleqetjobs.com;
    client_max_body_size 26m;

    ssl_certificate     /etc/nginx/ssl/beleqet.crt;
    ssl_certificate_key /etc/nginx/ssl/beleqet.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    location ~ ^/api/v1/telegram/(register|check-user|get-all-telegram-ids|update-payment-status|link-telegram|update-language)$ { return 403; }


    
    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# ── Admin dashboard ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name admin.beleqetjobs.com;

    ssl_certificate     /etc/nginx/ssl/beleqet.crt;
    ssl_certificate_key /etc/nginx/ssl/beleqet.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
