# promo.beleqetjobs.com: the Promotion bot (beleqet-promo-bot, port 8002), which serves its Mini
# App, its API and the webhook Telegram delivers its messages to. Behind Cloudflare, like the other
# beleqetjobs.com sites.
server {
    listen 80;
    server_name promo.beleqetjobs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name promo.beleqetjobs.com;

    ssl_certificate     /etc/nginx/ssl/beleqet.crt;
    ssl_certificate_key /etc/nginx/ssl/beleqet.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Payment screenshots are up to 5 MB.
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # Only the referral bots on this server send transfers, straight to 127.0.0.1:8002.
    location /api/internal/ {
        return 404;
    }
}
