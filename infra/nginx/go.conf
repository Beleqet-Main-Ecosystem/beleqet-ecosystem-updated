# go.beleqetjobs.com: the Go bot's Mini App, built by the deploy into
# /opt/beleqet/go/miniapp/dist, and under /api/ its API (beleqet-go-api, port 8001).
# Behind Cloudflare, like the other beleqetjobs.com sites.
server {
    listen 80;
    server_name go.beleqetjobs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name go.beleqetjobs.com;

    ssl_certificate     /etc/nginx/ssl/beleqet.crt;
    ssl_certificate_key /etc/nginx/ssl/beleqet.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /opt/beleqet/go/miniapp/dist;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Built files carry a content hash in their names; index.html must always be the newest.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
