# For now (Nov 2026): the Boost, Go and Promotion bots also at three beleqet.com names that point
# straight at this server, because boost., go. and promo.beleqetjobs.com have no DNS records yet.
# The bots use these: WEBAPP_URL in /opt/beleqet/boost/.env and /opt/beleqet/go/.env, WEBHOOK_DOMAIN
# in /opt/beleqet/promo/.env (its Mini App and the webhook Telegram delivers its messages to). Not
# behind Cloudflare, so the certificate is Let's Encrypt's: certbot renews it, and its challenge
# files are served on port 80.
# Once the beleqetjobs.com records exist: remove WEBAPP_URL from the Boost and Go .env files, set
# Promo's WEBHOOK_DOMAIN back to https://promo.beleqetjobs.com, restart the three bots
# (beleqet-boost-bot, beleqet-go-bot, beleqet-promo-bot), open http://127.0.0.1:8002/set_webhook on
# the server and point the Promotion bot's menu button at the new address; then disable this site
# and run `sudo certbot delete --cert-name beleqet-com-miniapps`.
server {
    listen 80;
    server_name beleqetaca-api.beleqet.com beleqetjobs-api.beleqet.com beleqet-promo-miniapp.beleqet.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Boost: as boost.conf
server {
    listen 443 ssl;
    server_name beleqetaca-api.beleqet.com;

    ssl_certificate     /etc/letsencrypt/live/beleqet-com-miniapps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beleqet-com-miniapps/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /opt/beleqet/boost/miniapp/dist;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Go: as go.conf
server {
    listen 443 ssl;
    server_name beleqetjobs-api.beleqet.com;

    ssl_certificate     /etc/letsencrypt/live/beleqet-com-miniapps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beleqet-com-miniapps/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /opt/beleqet/go/miniapp/dist;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Promotion bot: as promo.conf
server {
    listen 443 ssl;
    server_name beleqet-promo-miniapp.beleqet.com;

    ssl_certificate     /etc/letsencrypt/live/beleqet-com-miniapps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beleqet-com-miniapps/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Payment screenshots are up to 5 MB.
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # Only the referral bots on this server send transfers, straight to 127.0.0.1:8002.
    location /api/internal/ {
        return 404;
    }
}
