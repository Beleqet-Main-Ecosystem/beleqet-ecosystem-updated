# For now (Nov 2026): the Boost and Go Mini Apps also at two beleqet.com names that point straight
# at this server, because boost. and go.beleqetjobs.com have no DNS records yet. The bots open these
# (WEBAPP_URL in /opt/beleqet/boost/.env and /opt/beleqet/go/.env). Not behind Cloudflare, so the
# certificate is Let's Encrypt's: certbot renews it, and its challenge files are served on port 80.
# Once the beleqetjobs.com records exist: remove WEBAPP_URL from both .env files and restart the two
# bots (beleqet-boost-bot, beleqet-go-bot), then disable this site and run
# `sudo certbot delete --cert-name beleqet-com-miniapps`.
server {
    listen 80;
    server_name beleqetaca-api.beleqet.com beleqetjobs-api.beleqet.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Boost: as boost.conf
server {
    listen 443 ssl;
    server_name beleqetaca-api.beleqet.com;

    ssl_certificate     /etc/letsencrypt/live/beleqet-com-miniapps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beleqet-com-miniapps/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /opt/beleqet/boost/miniapp/dist;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

