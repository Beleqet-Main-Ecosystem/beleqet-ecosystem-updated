set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── beleqetjobs.com → :3001 (beleqet-jobs-nextjs, the whole website) ─────────
server {
    listen 80;
    server_name beleqetjobs.com www.beleqetjobs.com;

    # ── The whole website → beleqet-jobs-nextjs (:3001) ──────────────────────
    # Every page, the homepage included, comes from the portal, whose content all comes from
    # the API and its database. The old homepage app (frontend-main, :3002) is no longer
    # served: it showed invented companies, testimonials and fallback jobs.
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}

# ── Backend API → :4000 ───────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.beleqetjobs.com;

    # Uploads go up to 10 MB (CVs, project files, milestone work); nginx refuses bodies over 1 MB by default.
    client_max_body_size 12m;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}

