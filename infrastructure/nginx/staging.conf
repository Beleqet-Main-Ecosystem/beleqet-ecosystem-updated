map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Jobs & Freelance homepage → :3002 (frontend-main landing page) ──────────
# All authenticated / application routes pass through to :3001 first so that
# login, dashboard, apply, etc. continue to work without the user noticing.
# The homepage container only handles the marketing landing pages.
server {
    listen 80;
    server_name beleqetjobs.com www.beleqetjobs.com;

    # ── Application routes → beleqet-jobs-nextjs (:3001) ────────────────────
    # These paths require auth / API connectivity; served by the full Next.js app.
    location ~ ^/(jobs|freelance/[^$]|dashboard|login|register|forgot-password|profile|post-job|employer|cv-maker|applications|admin|messages|feed|forum|portfolio|checkout|payment|auth|chat|chat-to-text|resume-brain|storage|about|contact|pricing|tax-calculator|api) {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # ── Homepage / landing → frontend-main (:3002) ───────────────────────────
    # Handles: /, /freelance (marketing page), and Next.js static assets.
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}

# ── Backend API → :4000 ───────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.beleqetjobs.com;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
