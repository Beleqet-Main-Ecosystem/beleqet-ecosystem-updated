name: CI

# Validates every pull request and push to main across all three applications,
# builds and smoke-tests the production Docker images, and (on push to main
# only) publishes SHA-tagged images to GHCR for the production deploy.

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ── Repository, workflow, and script validation ────────────────────────────
  repo-validation:
    name: Repo & workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The commit scan below reads every commit in the pull request or push.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint GitHub Actions workflows (actionlint)
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.7 -color

      # "CI success" (the check branch protection requires) fails only when a job it waits for
      # fails, so a job left off its list could fail without blocking the merge.
      - name: Every job counts toward "CI success"
        run: |
          missing="$(comm -23 \
            <(yq '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx ci-success | sort) \
            <(yq '.jobs["ci-success"].needs[]' .github/workflows/ci.yml | sort))"
          if [ -n "$missing" ]; then
            echo "::error::add these jobs to ci-success's needs: ${missing//$'\n'/, }"
            exit 1
          fi

      - name: Lint shell scripts (shellcheck)
        run: shellcheck scripts/ci/*.sh scripts/deploy/*.sh

      - name: Lint Dockerfiles (hadolint, fail on errors)
        run: |
          for df in apps/api/Dockerfile apps/admin/Dockerfile apps/web/Dockerfile; do
            echo "hadolint: $df"
            docker run --rm -i hadolint/hadolint:v2.12.0 \
              hadolint --failure-threshold error - < "$df"
          done

      - name: Validate all Compose files render
        run: bash scripts/ci/verify-compose.sh

      - name: Scan working tree for secrets (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --no-git --redact --no-banner

      # The working-tree scan misses a secret that was committed and then deleted or overwritten
      # in the same change (how production secrets reached this public repo's history before).
      # This one reads every commit in the pull request or push.
      - name: Scan this change's commits for secrets (gitleaks)
        if: github.event_name != 'workflow_dispatch'
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.event.after) }}
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
          ./gitleaks detect --source . --config .gitleaks.toml --log-opts="$RANGE" --redact --no-banner

  # ── API static quality ─────────────────────────────────────────────────────
  api-quality:
    name: API lint, format, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npm run prisma:generate
      - name: ESLint (non-mutating)
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: TypeScript validation (src, test, tools)
        run: npx tsc --noEmit
      - name: NestJS production build
        run: npm run build

  # ── API unit tests ─────────────────────────────────────────────────────────
  api-unit:
    name: API unit tests & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beleqet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - name: Create synthetic test environment
        run: bash ../../scripts/ci/create-test-env.sh .env
      - run: npm run prisma:generate
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beleqet_test
        run: npm run prisma:migrate:deploy
      - name: Jest unit tests
        run: npm test
      # Fails when coverage drops below the floor in package.json (jest.coverageThreshold), set
      # just under the 24 Nov 2026 level: 73.5% statements, 54.4% branches, 63.7% functions,
      # 73.9% lines. Raise it as tests are added.
      - name: Jest coverage
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-coverage
          path: apps/api/coverage/lcov-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── API integration, NestJS E2E and smoke tests ────────────────────────
  api-integration:
    name: API integration & E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beleqet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - name: Create synthetic test environment
        run: bash ../../scripts/ci/create-test-env.sh .env
      - run: npm run prisma:generate
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beleqet_test
        run: npm run prisma:migrate:deploy
      - run: npm run build

      - name: Module integration tests
        run: npx jest --testPathPattern "integration\.spec\.ts$" --runInBand --forceExit

      - name: NestJS E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Boot the API and run its health smoke tests
        run: |
          if [ -f "dist/main.js" ]; then node dist/main & else node dist/src/main & fi
          API_PID=$!
          bash ../../scripts/deploy/health-check.sh http://127.0.0.1:4000/api/v1/health 30 2
          bash ../../scripts/deploy/health-check.sh http://127.0.0.1:4000/api/v1/health/ready 10 2
          curl -fsS http://127.0.0.1:4000/api/v1/jobs/categories > /dev/null
          echo "API smoke tests passed"
          kill "$API_PID"

  # ── Admin (apps/admin/) ──────────────────────────────────────────────────
  admin:
    name: Admin quality & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --ci
      - name: Production build
        run: npm run build

  # ── Mobile app (apps/mobile/, Expo, Android) ─────────────────────
  mobile:
    name: Mobile app quality & bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: TypeScript validation
        run: npm run type-check
      # Every t('key') exists in English and Amharic (the website's locales or the app's own).
      - name: Translations
        run: npm run check:i18n
      - name: Unit tests
        run: npm test -- --ci
      # The JavaScript bundle an Android build would ship: catches what type checks can't (a
      # missing file or package, a bad import). The app itself is built on EAS.
      - name: Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"

  # ── Shared code (packages/common/), used by the website and the app ──
  common:
    name: Shared package (packages/common)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/common
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/common/package-lock.json

      - run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci

  # ── The referral bots' Mini App (bots/referral/miniapp/), built for Boost and for Go ──
  bots-miniapps:
    name: Bot Mini App (${{ matrix.bot }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bot: [boost, go]
    defaults:
      run:
        working-directory: bots/referral/miniapp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bots/referral/miniapp/package-lock.json

      - run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build -- --mode ${{ matrix.bot }}

  # ── The bots' Python code (bots/<bot>/; Boost and Go are bots/referral), on the server's Python ──
  bots:
    name: Bot tests (${{ matrix.bot }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bot: [referral, jobs, promo]
    defaults:
      run:
        working-directory: bots/${{ matrix.bot }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: bots/${{ matrix.bot }}/requirements.txt

      - run: pip install -r requirements.txt pytest==9.2.0
      - name: Tests
        run: python -m pytest -q

  bots-lint:
    name: Bots code check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - run: pip install ruff==0.17.6
      # Rules in bots/ruff.toml: syntax errors, undefined or unused names, likely bugs.
      - run: ruff check bots

  # ── Website (apps/web/) ───────────────────────────────────────────
  web:
    name: Website quality, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: TypeScript validation
        run: npx tsc --noEmit
      # Jest owns all test files under apps/web/ after the
      # vitest→jest migration (PR #179). Both test and test:unit map to jest.
      - name: Jest suite
        run: npm run test:unit -- --runInBand
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api.beleqetjobs.com/api/v1
        run: npm run build

  # ── Playwright end-to-end (BLOCKING — no continue-on-error) ────────────────
  playwright-e2e:
    name: Playwright E2E (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beleqet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - name: Create synthetic test environment
        run: bash ../../scripts/ci/create-test-env.sh .env
      - run: npm run prisma:generate
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beleqet_test
        run: npm run prisma:migrate:deploy
      - run: npm run build

      - name: Create the test admin account and its permissions
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beleqet_test
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
        run: |
          node scripts/seed-rbac.js
          node scripts/dev/create-admin.js

      - name: Run the admin Playwright E2E tests against the API
        env:
          API_URL: http://127.0.0.1:4000/api/v1
          ADMIN_EMAIL: admin@beleqet.com
          ADMIN_PASSWORD: SecurePass123!
        run: |
          if [ -f "dist/main.js" ]; then node dist/main & else node dist/src/main & fi
          API_PID=$!
          bash ../../scripts/deploy/health-check.sh http://127.0.0.1:4000/api/v1/health/ready 30 2
          cd ../admin
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --trace retain-on-failure
          kill "$API_PID"

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/admin/playwright-report/
            apps/admin/test-results/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Docker images: build, start the full stack, scan, publish on main ──────
  docker-build:
    name: Docker build, stack smoke test & scan
    # The slowest job (about 9 minutes). It runs on main, where it builds the images the deploy
    # uses, so a bad image still never reaches production; pull requests skip it to get feedback
    # in about half the time. A manual run (workflow_dispatch) on any branch runs it too, for
    # changes to Dockerfiles or build paths; only a push to main publishes the images.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute image namespace
        id: meta
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Ensure frontend lockfiles contain swc deps
        run: |
          set -e
          cd apps/admin
          npm ci
          npm i --package-lock-only
          cd ../../apps/web
          npm ci
          npm i --package-lock-only
          cd ../..

      - name: Build API image
        run: >-
          docker build -t "${{ steps.meta.outputs.namespace }}/beleqet-api:${{ github.sha }}" apps/api

      - name: Build admin image
        run: >-
          docker build
          -t "${{ steps.meta.outputs.namespace }}/beleqet-admin:${{ github.sha }}"
          apps/admin

      - name: Build website image
        run: >-
          docker build
          -f apps/web/Dockerfile
          -t "${{ steps.meta.outputs.namespace }}/beleqet-web:${{ github.sha }}"
          .

      - name: Create synthetic CI environment
        run: |
          cat > .env.ci <<'EOF'
          CI_DB_USER=ci_smoke_user
          CI_DB_PASSWORD=ci_smoke_password
          CI_DB_NAME=ci_smoke_db
          CI_FRONTEND_URLS=http://localhost:3000,http://localhost:3001
          CI_APP_BASE_URL=http://localhost:4000
          JWT_ACCESS_SECRET=ci_smoke_jwt_secret_synthetic_0000000000000000000000000000000000
          SESSION_SECRET=ci_smoke_session_secret_synthetic
          TOTP_ENCRYPTION_KEY=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          TOTP_TEMP_SECRET=ci_smoke_totp_temp_secret_synthetic
          GDPR_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          E2EE_SERVER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ENCRYPTION_KEY=1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
          OAUTH_TOKEN_ENCRYPTION_KEY=VGVzdEVuY3J5cHRpb25LZXkzMkJ5dGVzTG9uZ1hZWjE=
          GOOGLE_CLIENT_ID=ci_smoke_google_client_id
          GOOGLE_CLIENT_SECRET=ci_smoke_google_client_secret
          GOOGLE_CALLBACK_URL=http://localhost:4000/api/v1/auth/google/callback
          LINKEDIN_CLIENT_ID=ci_smoke_linkedin_client_id
          LINKEDIN_CLIENT_SECRET=ci_smoke_linkedin_client_secret
          LINKEDIN_CALLBACK_URL=http://localhost:4000/api/v1/auth/linkedin/callback
          SMTP_HOST=localhost
          SMTP_PORT=2525
          SMTP_USER=ci_smoke_smtp_user
          SMTP_PASSWORD=ci_smoke_smtp_password
          SMTP_FROM_ADDRESS=noreply@example.test
          STRIPE_SECRET_KEY=sk_test_ci_smoke_synthetic
          STRIPE_WEBHOOK_SECRET=whsec_ci_smoke_synthetic
          PAYPAL_CLIENT_ID=ci_smoke_paypal_client_id
          PAYPAL_CLIENT_SECRET=ci_smoke_paypal_client_secret
          UNSUBSCRIBE_SECRET=synthetic_unsubscribe_secret_64chars_minimum_for_production_use
          EOF
          cat > .env.images <<EOF
          API_IMAGE=${{ steps.meta.outputs.namespace }}/beleqet-api:${{ github.sha }}
          ADMIN_IMAGE=${{ steps.meta.outputs.namespace }}/beleqet-admin:${{ github.sha }}
          WEB_IMAGE=${{ steps.meta.outputs.namespace }}/beleqet-web:${{ github.sha }}
          EOF

      - name: Validate CI compose renders
        run: >-
          docker compose --env-file .env.ci --env-file .env.images
          -f docker-compose.ci.yml config > /dev/null

      - name: Start database and cache
        run: |
          docker compose --env-file .env.ci --env-file .env.images \
            -f docker-compose.ci.yml up -d --wait db redis

      - name: Apply migrations (single controlled step)
        run: |
          docker compose --env-file .env.ci --env-file .env.images \
            -f docker-compose.ci.yml run --rm --no-deps api \
            ./node_modules/.bin/prisma migrate deploy

      - name: API startup diagnosis (boot-test)
        run: |
          source .env.ci
          source .env.images
          echo "--- Start the API via compose (same network as db/redis) ---"
          docker compose --env-file .env.ci --env-file .env.images \
            -f docker-compose.ci.yml up -d api
          echo "Waiting up to 30s for the API to start and register logs..."
          sleep 30
          echo "--- API boot logs (last 200 lines) ---"
          docker compose --env-file .env.ci --env-file .env.images \
            -f docker-compose.ci.yml logs --tail 200 api || true

      - name: Start full stack and verify every container becomes healthy
        run: |
          docker compose --env-file .env.ci --env-file .env.images \
            -f docker-compose.ci.yml up -d --wait
          bash scripts/deploy/health-check.sh http://127.0.0.1:4000/api/v1/health/ready 30 3
          bash scripts/deploy/health-check.sh http://127.0.0.1:3000/ 20 3
          bash scripts/deploy/health-check.sh http://127.0.0.1:3001/ 20 3

      - name: Collect stack logs on failure
        if: failure()
        run: |
          echo "=== Container states ==="
          docker compose --env-file .env.ci --env-file .env.images \
            -f docker-compose.ci.yml ps || true
          echo "=== API CRASH LOGS (last 200 lines) ==="
          docker compose --env-file .env.ci --env-file .env.images \
            -f docker-compose.ci.yml logs --tail 200 api || true
          echo "=== ALL SERVICE LOGS (last 50 lines each) ==="
          docker compose --env-file .env.ci --env-file .env.images \
            -f docker-compose.ci.yml logs --tail 50 || true

      - name: Tear down smoke stack
        if: always()
        run: |
          docker compose --env-file .env.ci --env-file .env.images \
            -f docker-compose.ci.yml down -v || true

      - name: Scan images for critical vulnerabilities (trivy)
        run: |
          mkdir -p trivy-reports trivy-cache
          # Download the vulnerability database once, trying each mirror in turn: a single
          # mirror answering 404 used to fail the whole job.
          db_ready=""
          for repo in mirror.gcr.io/aquasec/trivy-db:2 ghcr.io/aquasecurity/trivy-db:2 public.ecr.aws/aquasecurity/trivy-db:2; do
            if docker run --rm -v "$PWD/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:0.58.1 image --download-db-only --db-repository "$repo"; then
              db_ready=1
              break
            fi
            echo "trivy database not available from $repo, trying the next mirror"
          done
          [ -n "$db_ready" ] || { echo "::error::no trivy database mirror answered"; exit 1; }
          for svc in beleqet-api beleqet-admin beleqet-web; do
            image="${{ steps.meta.outputs.namespace }}/${svc}:${{ github.sha }}"
            echo "trivy: $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/trivy-cache:/root/.cache/trivy" \
              -v "$PWD/trivy-reports:/reports" \
              aquasec/trivy:0.58.1 image --skip-db-update \
              --severity HIGH,CRITICAL --format table \
              --output "/reports/${svc}.txt" --exit-code 0 "$image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:0.58.1 image --skip-db-update \
              --severity CRITICAL --ignore-unfixed --exit-code 0 "$image"
          done

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-reports
          path: trivy-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Push SHA-tagged images to GHCR (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          for svc in beleqet-api beleqet-admin beleqet-web; do
            docker push "${{ steps.meta.outputs.namespace }}/${svc}:${{ github.sha }}"
          done

  # ── Dependency security audit ──────────────────────────────────────────────
  # Fails on a critical or high vulnerability in a project's production packages (npm), or on any
  # known one (the bots' Python packages), unless scripts/ci/audit-allowlist.json lists it with its
  # reason. npm reads only the lockfile, so nothing is installed.
  security:
    name: Dependency audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: apps/api, kind: npm }
          - { project: apps/web, kind: npm }
          - { project: apps/admin, kind: npm }
          - { project: apps/mobile, kind: npm }
          - { project: packages/common, kind: npm }
          - { project: bots/referral/miniapp, kind: npm }
          - { project: bots/jobs, kind: python }
          - { project: bots/promo, kind: python }
          - { project: bots/referral, kind: python }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.kind == 'python'
        with:
          python-version: "3.10"
      - if: matrix.kind == 'python'
        run: pip install pip-audit==2.10.1

      - name: Audit
        run: node scripts/ci/audit-gate.js ${{ matrix.project }}

  # ── Single aggregate gate for branch protection ────────────────────────────
  ci-success:
    name: CI success
    if: always()
    needs:
      - repo-validation
      - api-quality
      - api-unit
      - api-integration
      - admin
      - mobile
      - common
      - bots-miniapps
      - bots
      - bots-lint
      - web
      - playwright-e2e
      - docker-build
      - security
    runs-on: ubuntu-latest
    steps:
      - name: Verify every mandatory job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS_JSON"
          # Every job must succeed; only the Docker job may be skipped, and only on pull requests.
          failed="$(echo "$NEEDS_JSON" | jq -r --arg ev "$EVENT" '
            to_entries[]
            | select(.value.result != "success")
            | select(($ev == "pull_request" and .key == "docker-build" and .value.result == "skipped") | not)
            | .key')"
          if [ -n "$failed" ]; then
            echo "::error::mandatory job(s) did not succeed: ${failed//$'\n'/, }"
            exit 1
          fi
          echo "All mandatory jobs succeeded"
